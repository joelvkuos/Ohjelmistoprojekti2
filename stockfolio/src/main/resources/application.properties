jul.logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security=DEBUG
spring.application.name=stockfolio
server.port=8080
#spring.datasource.url=jdbc:postgresql://localhost:5432/stockfoliodb
#spring.datasource.username=postgres
